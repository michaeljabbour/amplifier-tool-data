[package]
name = "amplifier-data-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust append-only event kernel + regenerate() fold for amplifier-data (no PyO3 -- cargo test-able)."
repository = "https://github.com/michaeljabbour/amplifier-tool-data"

[lib]
crate-type = ["rlib"]

[dependencies]
sha2 = "0.10"   # sha256

# NOTE: no pyo3 here — keeps `cargo test` free of libpython linking.

[dev-dependencies]
# (none required; std + sha2 suffice)
